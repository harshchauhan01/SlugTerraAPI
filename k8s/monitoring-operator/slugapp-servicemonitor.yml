apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slugapp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - slugapi-ns
  selector:
    matchLabels:
      app: slugapp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
