apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: slugapp
        metrics_path: /metrics
        static_configs:
          - targets:
              - slugapp.slugapi-ns.svc.cluster.local:80

      - job_name: postgres-exporter
        static_configs:
          - targets:
              - postgres-exporter.slugapi-ns.svc.cluster.local:9187

      - job_name: redis-exporter
        static_configs:
          - targets:
              - redis-exporter.slugapi-ns.svc.cluster.local:9121

      - job_name: node-exporter
        static_configs:
          - targets:
              - node-exporter.monitoring.svc.cluster.local:9100

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
