apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: slugapp
        metrics_path: /metrics
        static_configs:
          - targets:
              - slugapp.slugapi-ns.svc.cluster.local:80

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
